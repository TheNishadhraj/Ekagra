name: ekagra
description: Ekagra — ADHD Focus & Plan. Shame-free daily companion.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  uuid: ^4.5.1
  intl: ^0.19.0
  shared_preferences: ^2.3.3
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  # WI-1.1 (K18 fix): real local export — documents dir + OS share sheet.
  # Both are first-party Flutter favorites with stable APIs; the export
  # feature degrades honestly (error snackbar) if either is unavailable.
  path_provider: ^2.1.4
  share_plus: ^10.0.2
  # WI-1.4: local-only gentle nudges (the #1 research wishlist ask).
  # flutter_local_notifications is the de-facto standard plugin; pinned to
  # the 17.x line whose API the single adapter file is written against.
  # timezone is its scheduling companion (tz-aware datetimes). No backend,
  # no push service — everything is scheduled on-device.
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/sounds/
    - assets/templates/
